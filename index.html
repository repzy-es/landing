<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Repzy — Próximamente</title>
    <meta name="description" content="Entrenamiento y comida que enseñan la cuenta." />
    <link rel="icon" href="favicon.png" />
    <meta property="og:title" content="Repzy" />
    <meta property="og:description" content="Entrenamiento y comida que enseñan la cuenta." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7FB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030D1F" />

    <!--
      THE PRE-LAUNCH PAGE. Static, no build step, deployed on its own like
      `web-deletion/` — so it can be at the domain long before there is anything
      to sign into.

      Four things and nothing else: the mark, "próximamente", three lines, and a
      way to be told. Centred and vertically middled, because with this little on
      it a page pinned to the top edge reads as a page that failed to load.
    -->

    <style>
      /* The app's own tokens, so the page and the product are one thing. */
      :root {
        --papel: #f4f7fb;
        --tinta: #0d1626;
        --tinta-2: #3a4a5e;
        --tinta-3: #586a80;
        --verdigris: #0a7180;
        --verd-wash: #def3f6;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --papel: #030d1f;
          --tinta: #ffffff;
          --tinta-2: #a9b8cc;
          --tinta-3: #7e8fa6;
          --verdigris: #01deb3;
          --verd-wash: #052b2b;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--papel);
        color: var(--tinta);
        font-family: var(--sans);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }

      main { max-width: 30rem; }

      .mark { width: min(300px, 78vw); height: auto; display: block; margin: 0 auto; }
      .mark-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        .mark-light { display: none; }
        .mark-dark { display: block; }
      }

      .soon {
        display: inline-block;
        margin-top: 2.25rem;
        padding: 0.45rem 0.95rem;
        border: 1px solid var(--verdigris);
        border-radius: 3px;
        background: var(--verd-wash);
        color: var(--verdigris);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      /* The three lines. Separated by air, not by bullets: three short
         sentences do not need a list to be read as three things. */
      .lines { margin: 2.5rem 0 0; display: grid; gap: 0.85rem; }
      .lines p { margin: 0; font-size: 1.05rem; color: var(--tinta-2); text-wrap: balance; }
      .lines strong { color: var(--tinta); font-weight: 600; }

      footer { margin-top: 3rem; font-size: 0.86rem; color: var(--tinta-3); }
      footer a { color: var(--verdigris); }
      :focus-visible { outline: 2px solid var(--verdigris); outline-offset: 3px; }
    </style>
  </head>

  <body>
    <main>
      <!-- Two cuts, not one recoloured: the wordmark changes colour with the
           ground and the mark does not. -->
      <img class="mark mark-light" src="lockup-light.png" alt="Repzy" width="671" height="181" />
      <img class="mark mark-dark" src="lockup-dark.png" alt="Repzy" width="578" height="168" />

      <span class="soon">Próximamente</span>

      <div class="lines">
        <p>Entrenamiento y comida en un mismo cuaderno.</p>
        <p><strong>Ninguna cifra sin enseñarte de dónde sale.</strong></p>
        <p>Y con tu entrenador dentro, si lo tienes.</p>
      </div>

      <footer>
        <a href="mailto:hola@repzy.ai">hola@repzy.es</a>
      </footer>
    </main>
  </body>
</html>
